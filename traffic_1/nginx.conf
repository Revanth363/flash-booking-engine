events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    limit_req_zone $binary_remote_addr zone=ip_rate_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=ip_conn_limit:10m;

    upstream go_backend {
        least_conn;
        server host.docker.internal:8080 max_fails=3 fail_timeout=5s;
        keepalive 64;
    }

    server {
        listen 80;
        server_name localhost;

        client_body_buffer_size 128k;
        client_max_body_size 1m;
        client_header_buffer_size 1k;
        large_client_header_buffers 4 8k;

        client_body_timeout 3s;
        client_header_timeout 2s;
        send_timeout 3s;
        keepalive_timeout 30s;

        location /healthz {
            proxy_pass http://go_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location /api/ {
            limit_req zone=ip_rate_limit burst=20 nodelay;
            limit_conn ip_conn_limit 50;

            proxy_pass http://go_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_read_timeout 4s;
            proxy_send_timeout 4s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}

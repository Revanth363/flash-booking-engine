services:
  nginx:
    image: nginx:alpine
    container_name: fbe_nginx
    ports:
      - "80:80"
    volumes:
      - ./traffic_1/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

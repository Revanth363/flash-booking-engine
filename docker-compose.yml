services:
  postgres:
    image: postgres:16-alpine
    container_name: fbe_postgres
    environment:
      POSTGRES_USER: fbe_user
      POSTGRES_PASSWORD: fbe_password
      POSTGRES_DB: fbe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fbe_user -d fbe_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
